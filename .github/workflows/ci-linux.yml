name: CI Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff + bandit
        run: pip install ruff bandit
      - name: Ruff (scripts + utils + verification)
        run: ruff check scripts utils verification tests
      - name: Bandit high-severity gate
        run: bandit -r scripts utils -lll -c .bandit
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (no MLX / torch)
        run: pip install pytest numpy scipy scikit-learn pyyaml
      - name: Pytest (non-MLX units)
        run: PYTHONPATH=. pytest tests -q
